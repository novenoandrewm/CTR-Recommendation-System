[project]
name = "ctr-recommendation-system"
version = "0.1.0"
description = "Reproducible CTR prediction for Huawei TechArena"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
ctr = "ctr_recommendation.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"